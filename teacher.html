<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooka Teachers</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqV9Py9CW9tFMjcYGvucYELmDm3PFUcVQ",
  authDomain: "dooka-staff.firebaseapp.com",
  projectId: "dooka-staff",
  storageBucket: "dooka-staff.firebasestorage.app",
  messagingSenderId: "143844824656",
  appId: "1:143844824656:web:31d9edfeccddb1d8d32355"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const q = query(collection(db, "updates"), orderBy("date","asc"));
let first=true;
onSnapshot(q, (snap)=>{
  let html='';
  let today = new Date().toISOString().substring(0,10);
  snap.forEach(doc=>{
    let d=doc.data();
    let col=d.type==='urgent'?'#d00':d.type==='meeting'?'#007aff':'#2e7d32';
    let isPast = d.date < today ? 'opacity:0.5' : '';
    html+=`<div class="card" style="border-left:5px solid ${col};${isPast}"><span class="badge" style="background:${col}">${(d.type||'meeting').toUpperCase()}</span><small style="float:right">${d.date||''}</small><h3 style="margin:8px 0">${d.title}</h3><p>⏰ ${d.time||''}</p><p>${d.desc||''}</p></div>`;
  });
  document.getElementById('list').innerHTML=html||'<div class="card">No meetings yet</div>';
  document.getElementById('count').innerText=snap.size+' meetings in 2026';
  if(!first && snap.docChanges().some(c=>c.type==='added')){
    try{ navigator.vibrate && navigator.vibrate(500); }catch(e){}
    let audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
    audio.play().catch(()=>{});
  }
  first=false;
});
</script>
<style>
body{margin:0;font-family:sans-serif;background:#fdf8f5}
.header{background:#7b2c2c;color:white;padding:20px;text-align:center}
.header img{width:80px;height:80px;border-radius:50%;background:white;padding:5px;object-fit:contain}
.card{background:white;margin:10px;padding:14px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.badge{padding:4px 8px;border-radius:6px;color:white;font-size:11px}
.countBar{background:#2e7d32;color:white;text-align:center;padding:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2602/2602414.png'">
<h2>Dooka Primary School</h2>
<p>Teacher Updates 2026</p>
</div>
<div class="countBar" id="count">Loading year plan...</div>
<div class="card" style="text-align:center;background:#fff8f0">
<h3>👋 Dumela Teacher</h3>
<p style="font-size:13px">You will see all meetings for whole year below.<br>When Principal posts new meeting, it appears instantly!</p>
</div>
<div id="list"><div class="card">Loading cloud updates...</div></div>
</body>
</html>
