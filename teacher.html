<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooka Teachers</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqV9Py9CW9tFMjcYGvucYELmDm3PFUcVQ",
  authDomain: "dooka-staff.firebaseapp.com",
  projectId: "dooka-staff",
  storageBucket: "dooka-staff.firebasestorage.app",
  messagingSenderId: "143844824656",
  appId: "1:143844824656:web:31d9edfeccddb1d8d32355"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messaging = getMessaging(app);

window.enableCloud = async () => {
  try{
    const permission = await Notification.requestPermission();
    if(permission!== 'granted') return alert('Please Allow Notifications');
    // PASTE YOUR VAPID KEY HERE - replace below
    const VAPID_KEY = "YOUR_VAPID_KEY_HERE";
    const token = await getToken(messaging, {vapidKey: VAPID_KEY});
    console.log('Token:', token);
    alert('✅ Cloud Notifications ON! You will get alerts like WhatsApp');
    new Notification('Dooka Teachers', {body:'Notifications ON! You will receive meetings'});
  }catch(e){ alert('Enable in HTTPS only. Error: '+e.message); }
}

const q = query(collection(db, "updates"), orderBy("created","desc"));
onSnapshot(q, (snap)=>{
  let html='';
  snap.forEach(doc=>{
    let d=doc.data();
    let col=d.type==='urgent'?'#d00':d.type==='meeting'?'#007aff':'#2e7d32';
    html+=`<div class="card" style="border-left:5px solid ${col}"><span class="badge" style="background:${col}">${d.type?.toUpperCase()}</span><small style="float:right">${d.posted||''}</small><h3 style="margin:8px 0">${d.title}</h3><p>📅 ${d.date||''} ⏰ ${d.time||''}</p><p>${d.desc||''}</p></div>`;
  });
  document.getElementById('list').innerHTML=html||'<div class="card">No meetings yet</div>';
  if(snap.docChanges().length>0 && snap.docChanges()[0].type==='added'){
    let latest=snap.docChanges()[0].doc.data();
    if(Notification.permission==='granted' && document.hidden){
      new Notification('Dooka: '+latest.title,{body:(latest.date||'')+' '+(latest.time||'')+' - '+(latest.desc||'')});
    }
  }
});

onMessage(messaging, (payload)=>{
  new Notification(payload.notification.title,{body:payload.notification.body});
});
</script>
<style>
body{margin:0;font-family:sans-serif;background:#fdf8f5}
.header{background:#7b2c2c;color:white;padding:20px;text-align:center}
.header img{width:75px;height:75px;border-radius:50%;background:white;padding:4px}
.card{background:white;margin:12px;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{background:#7b2c2c;color:white;border:none;padding:14px;border-radius:10px;width:100%;font-weight:bold;font-size:15px}
.badge{padding:4px 8px;border-radius:6px;color:white;font-size:11px}
</style>
</head>
<body>
<div class="header">
<img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2602/2602414.png'">
<h2>Dooka Primary School</h2>
<p>Teacher Updates</p>
</div>
<div class="card" style="text-align:center;background:#fff8f0">
<h3>👋 Dumela Teacher</h3>
<button class="btn" onclick="enableCloud()">🔔 Enable Cloud Notifications</button>
<p style="font-size:11px;margin-top:6px">Click once - you will get meeting alerts even when app closed!</p>
</div>
<div id="list"><div class="card">Loading cloud updates...</div></div>
</body>
</html>
