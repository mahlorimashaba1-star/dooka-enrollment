<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooka Admin - MAROON</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#fdf0f0}
.top{background:#800000;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.btn{padding:9px 13px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin:2px}
.btn-gold{background:#ffd700;color:#800000}.btn-white{background:white;color:#800000}.btn-red{background:red;color:white}
.box{background:white;margin:10px;padding:12px;border-radius:12px;border:2px solid #800000}
.input{padding:10px;border:2px solid #800000;border-radius:8px;width:100%;margin:4px 0;font-weight:bold}
.card{border:2px solid #800000;border-radius:12px;padding:12px;margin:10px 0;background:white;position:relative}
.badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:900;color:white}
.pending{background:orange}.approved{background:green}.rejected{background:red}
.doc-btn{display:inline-block;padding:6px 10px;margin:3px;background:#800000;color:#ffd700;border-radius:6px;font-size:12px;font-weight:bold;text-decoration:none;cursor:pointer}
.preview-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center;flex-direction:column}
.preview-modal img{max-width:95%;max-height:80%;border:4px solid white;border-radius:10px;background:white}
</style>
</head>
<body>
<div class="top">
<div><b>DOOKA ADMIN</b> <span id="conn" style="font-size:10px;background:red;padding:3px 7px;border-radius:10px">● OFFLINE</span><br><span id="count" style="font-size:11px;color:#ffd700">Loading...</span></div>
<div><button class="btn btn-white" onclick="load()">🔄 Refresh</button><button class="btn btn-gold" onclick="exportCSV()">📥 Excel</button><a href="index.html" class="btn btn-white" style="text-decoration:none">Form</a></div>
</div>
<div class="box">
<div style="display:flex;gap:6px"><input id="search" class="input" placeholder="Search name/phone/admission..." oninput="filter()"><select id="filterGrade" class="input" onchange="filter()"><option value="">All Grades</option><option>Grade R</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option></select></div>
<div id="stats" style="font-size:12px;font-weight:bold;margin-top:6px"></div>
</div>
<div id="list" class="box"><p>Loading...</p></div>
<div id="modal" class="preview-modal" onclick="this.style.display='none'">
<img id="modalImg" src=""><br>
<button class="btn btn-white" style="margin-top:10px" onclick="document.getElementById('modal').style.display='none'">✖ Close</button>
<a id="modalDownload" class="btn btn-gold" download="document.jpg" style="margin-top:10px;text-decoration:none">⬇ Download</a>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCVm-xNEv4IwZ5pk79YFOLOMapnAOlUCrM",authDomain:"dooka-enrollment.firebaseapp.com",projectId:"dooka-enrollment",storageBucket:"dooka-enrollment.firebasestorage.app",messagingSenderId:"75187233656",appId:"1:75187233656:web:962e5eba5b15892c295e8d"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let allData=[];
async function load(){
 document.getElementById('conn').innerText='● CONNECTING...'; document.getElementById('conn').style.background='orange';
 try{
  let snap=await db.collection('enrollments').orderBy('Timestamp','desc').get();
  allData=[]; snap.forEach(d=>{let o=d.data();o.id=d.id;allData.push(o)});
  document.getElementById('conn').innerText='● LIVE ONLINE'; document.getElementById('conn').style.background='green';
  document.getElementById('count').innerText=allData.length+' Total - MAROON FREE VERSION';
  document.getElementById('stats').innerText='Pending: '+allData.filter(x=>x.Status=='Pending').length+' | Approved: '+allData.filter(x=>x.Status=='Approved').length;
  render(allData);
 }catch(e){
  document.getElementById('conn').innerText='● RULES ERROR'; document.getElementById('conn').style.background='red';
  document.getElementById('list').innerHTML='<p style="color:red">Firestore Rules Error - Set allow read,write: if true</p>';
 }
}
function render(data){
 let html=''; if(data.length==0){html='<p>No records</p>';} else {
  data.forEach((x,i)=>{
   html+=`<div class="card">
   <span class="badge ${x.Status=='Approved'?'approved':x.Status=='Rejected'?'rejected':'pending'}">${x.Status||'Pending'}</span>
   <b>#${i+1} ${x.FullName||''}</b> <small>Adm: ${x.AdmissionNo||''}</small><br>
   <small>Grade: ${x.Grade} | ${x.Gender} | DOB: ${x.DOB||''}</small><br>
   <small>Parent: ${x.ParentName} (${x.Relation}) - ${x.ParentPhone}</small><br>
   <small>📞 ${x.ParentPhone} | Alt: ${x.ParentPhone2||'-'} | WA: ${x.WhatsApp||''} | ${x.Email||''}</small><br>
   <small>🚨 Emergency: ${x.EmergencyName||''} ${x.EmergencyPhone||''}</small><br>
   <small>Parent2: ${x.Parent2Name||''} ${x.Parent2Phone||''} | Addr: ${x.Address}</small><br>
   <div style="margin-top:6px">
   ${x.BirthCertFile?`<span class="doc-btn" onclick="viewDoc('${x.id}','BirthCertFile')">👶 Birth Cert</span>`:''}
   ${x.ParentIDFile?`<span class="doc-btn" onclick="viewDoc('${x.id}','ParentIDFile')">🪪 Parent ID</span>`:''}
   ${x.ProofFile?`<span class="doc-btn" onclick="viewDoc('${x.id}','ProofFile')">🏠 Proof</span>`:''}
   </div>
   <div style="margin-top:8px">
   <button class="btn btn-gold" onclick="setStatus('${x.id}','Approved')">✅ Approve</button>
   <button class="btn btn-red" onclick="setStatus('${x.id}','Rejected')">❌ Reject</button>
   <button class="btn btn-white" style="border:1px solid #800000" onclick="del('${x.id}')">🗑 Delete</button>
   </div>
   <small style="color:gray">${x.Date||''}</small>
   </div>`;
  });
 } document.getElementById('list').innerHTML=html;
}
function viewDoc(id,field){
 let rec=allData.find(a=>a.id==id); let data=rec[field];
 document.getElementById('modalImg').src=data; document.getElementById('modalDownload').href=data; document.getElementById('modal').style.display='flex';
}
function filter(){
 let q=document.getElementById('search').value.toLowerCase(), g=document.getElementById('filterGrade').value;
 let f=allData.filter(x=>{let m=(x.FullName||'').toLowerCase().includes(q)||(x.ParentPhone||'').includes(q)||(x.AdmissionNo||'').toLowerCase().includes(q); let mg=g?x.Grade==g:true; return m&&mg;});
 render(f);
}
async function setStatus(id,st){await db.collection('enrollments').doc(id).update({Status:st}); load();}
async function del(id){if(confirm('Delete?')){await db.collection('enrollments').doc(id).delete(); load();}}
function exportCSV(){
 if(allData.length==0) return alert('No data');
 let rows=[['AdmissionNo','FullName','Grade','Gender','Phone1','Phone2','WhatsApp','Email','Emergency','Parent2','Address','Status','Date']];
 allData.forEach(x=>{rows.push([x.AdmissionNo,x.FullName,x.Grade,x.Gender,x.ParentPhone,x.ParentPhone2,x.WhatsApp,x.Email,x.EmergencyName+' '+x.EmergencyPhone,x.Parent2Name+' '+x.Parent2Phone,x.Address,x.Status,x.Date]);});
 let csv=rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
 let blob=new Blob([csv],{type:'text/csv'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='dooka_enrollments.csv'; a.click();
}
load();
</script>
</body>
</html>
