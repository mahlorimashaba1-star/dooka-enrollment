<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dooka ADMIN - Locked</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;background:#fdf8f5;font-family:Arial}
.top{background:#7b2c2c;color:white;padding:15px;text-align:center;border-bottom:5px solid #d4af37}
.tabs{display:flex;background:#333}.tabs button{flex:1;padding:14px;border:0;color:white;font-weight:bold;cursor:pointer}.tabs button.active{background:#2e7d32}
.tabContent{display:none}.tabContent.active{display:block}
.card{background:white;margin:10px;padding:12px;border-radius:10px;box-shadow:0 2px 4px #999}
input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:bold;color:white;cursor:pointer;margin-top:6px}
.btnGreen{background:#2e7d32}.btnBlue{background:#0d47a1}.btnGold{background:#d4af37;color:#7b2c2c;border:2px solid #7b2c2c}
/* PASSWORD LOCK SCREEN */
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#7b2c2c;display:flex;align-items:center;justify-content:center;z-index:9999}
.lockBox{background:white;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 20px rgba(0,0,0,0.5)}
.lockBox h2{color:#7b2c2c}.lockBox input{font-size:18px;text-align:center;letter-spacing:2px}
</style>
</head><body>

<!-- PASSWORD SCREEN -->
<div id="lockScreen">
<div class="lockBox">
<h2>🔒 DOOKA ADMIN</h2><p style="color:#666">Principal Access Only</p>
<input id="pwd" type="password" placeholder="Enter Password">
<button class="btn btnGreen" onclick="checkPwd()">UNLOCK</button>
<small id="pwdErr" style="color:red;display:none">Wrong password! Call developer.</small>
<p style="margin-top:10px;font-size:11px;color:#888">Default: Dooka2026!</p>
</div>
</div>

<div class="top"><h2 style="margin:0">DOOKA SUPER ADMIN</h2><small>Meetings + SA-SAMS Export</small><div id="cnt">...</div></div>
<div class="tabs">
<button id="tabBtn1" class="active" onclick="showTab('meetings')">📅 MEETINGS</button>
<button id="tabBtn2" onclick="showTab('learners')">🎓 SA-SAMS</button>
</div>

<div id="meetings" class="tabContent active">
<div class="card"><h3 style="margin:0;color:#7b2c2c">Add Meeting</h3>
<input id="mTitle" placeholder="Title"><input id="mDate" type="date"><input id="mTime" type="time">
<select id="mType"><option value="meeting">Meeting</option><option value="urgent">Urgent</option><option value="exam">Exam</option><option value="event">Event</option></select>
<textarea id="mDesc" placeholder="Description"></textarea>
<button class="btn btnGreen" onclick="addMeeting()">ADD - Teachers see instantly</button>
</div><div id="mList"></div>
</div>

<div id="learners" class="tabContent">
<div class="card"><h3 style="margin:0;color:#7b2c2c">Add Learner - SA-SAMS</h3>
<input id="surname" placeholder="Surname *"><input id="firstname" placeholder="First Names *">
<input id="idno" placeholder="ID 13 digits"><input id="dob" type="date">
<select id="gender"><option value="">Gender *</option><option value="M">M</option><option value="F">F</option></select>
<select id="race"><option value="">Race *</option><option value="B">B</option><option value="W">W</option><option value="C">C</option><option value="I">I</option></select>
<select id="lang"><option value="">Language *</option><option value="Z">Z - Zulu</option><option value="X">X - Xhosa</option><option value="S">S - Sotho</option><option value="P">P - Sepedi</option><option value="E">E - English</option></select>
<select id="grade"><option value="">Grade *</option><option>R</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
<input id="class" placeholder="Class 4A"><input id="parentName" placeholder="Parent Name"><input id="parentCell" placeholder="Parent Cell"><input id="address" placeholder="Address">
<button class="btn btnGreen" onclick="addLearner()">SAVE LEARNER</button>
<button class="btn btnGold" onclick="exportCSV('sams')">⭐ EXPORT FOR SA-SAMS / LURITS</button>
</div><div id="lList"></div>
</div>

<script>
// === CHANGE YOUR PASSWORD HERE ===
const ADMIN_PASSWORD = "Dooka2026!"; // <-- Change this to your secret!

function checkPwd(){
 if(document.getElementById('pwd').value === ADMIN_PASSWORD){
  localStorage.setItem('dooka_admin_ok','yes');
  document.getElementById('lockScreen').style.display='none';
 } else {
  document.getElementById('pwdErr').style.display='block';
 }
}
if(localStorage.getItem('dooka_admin_ok')==='yes'){document.getElementById('lockScreen').style.display='none';}

function showTab(t){
 document.querySelectorAll('.tabContent').forEach(c=>c.classList.remove('active'));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 document.getElementById(t).classList.add('active');
 document.getElementById(t=='meetings'?'tabBtn1':'tabBtn2').classList.add('active');
}
const firebaseConfig={apiKey:"AIzaSyBqV9Py9CW9tFMjcYGvucYELmDm3PFUcVQ",authDomain:"dooka-staff.firebaseapp.com",projectId:"dooka-staff",storageBucket:"dooka-staff.firebasestorage.app",messagingSenderId:"143844824656",appId:"1:143844824656:web:31d9edfeccddb1d8d32355"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();

function addMeeting(){
 let t=mTitle.value, d=mDate.value; if(!t||!d) return alert("Title & Date required!");
 db.collection("updates").add({title:t,date:d,time:mTime.value,type:mType.value,desc:mDesc.value,created:Date.now()}).then(()=>{alert("Added!"); mTitle.value="";});
}
db.collection("updates").orderBy("date","asc").onSnapshot(s=>{
 let h=""; s.forEach(doc=>{let m=doc.data(); h+=`<div class=card><b>${m.date} ${m.time||""}</b> - ${m.title}<br><small>${m.desc||""}</small><button onclick="if(confirm('Delete?'))db.collection('updates').doc('${doc.id}').delete()" style="float:right;background:#d00;color:white;border:0;padding:5px 10px;border-radius:6px">DELETE</button></div>`;});
 document.getElementById('mList').innerHTML=h; updateCnt();
});

let allLearners=[];
function addLearner(){
 let s=surname.value.trim(), f=firstname.value.trim(); if(!s||!f) return alert("Surname & Names required!");
 db.collection("learners").add({surname:s,firstname:f,idno:idno.value,dob:dob.value,gender:gender.value,race:race.value,lang:lang.value,grade:grade.value,class:document.getElementById('class').value,parentName:parentName.value,parentCell:parentCell.value,address:address.value,created:Date.now()}).then(()=>{alert("Saved!"); surname.value=""; firstname.value="";});
}
db.collection("learners").orderBy("surname").onSnapshot(snap=>{
 allLearners=[]; let html=""; snap.forEach(d=>{let l=d.data(); allLearners.push(l); html+=`<div class=card><b>${l.surname} ${l.firstname}</b> - ${l.grade||""}${l.class||""}<button onclick="db.collection('learners').doc('${d.id}').delete()" style="float:right;background:#d00;color:white;border:0;padding:4px 8px;border-radius:5px">X</button></div>`;});
 document.getElementById('lList').innerHTML=html; updateCnt();
});
function updateCnt(){ document.getElementById('cnt').innerText=(document.getElementById('mList').children.length||0)+" meetings | "+allLearners.length+" learners"; }
function exportCSV(type){
 if(allLearners.length==0) return alert("No learners!");
 let csv="Surname,First Names,ID Number,Date of Birth,Gender,M,F,Race,Home Language,Grade,Class,Parent Name,Parent Cell,Address,CEMIS No,Admission No,Status\n";
 allLearners.forEach(l=>{ let dobF=l.dob?l.dob.split("-").join("/"): ""; let m=l.gender=="M"?"M":""; let f=l.gender=="F"?"F":""; csv+=`"${l.surname}","${l.firstname}","${l.idno}","${dobF}","${l.gender}","${m}","${f}","${l.race}","${l.lang}","${l.grade}","${l.class}","${l.parentName}","${l.parentCell}","${l.address}","","","ENROLLED"\n`; });
 let blob=new Blob([csv],{type:"text/csv"}); let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Dooka_SA-SAMS_LURITS.csv"; a.click();
}
</script>
</body></html>
