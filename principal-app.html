<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqV9Py9CW9tFMjcYGvucYELmDm3PFUcVQ",
  authDomain: "dooka-staff.firebaseapp.com",
  projectId: "dooka-staff",
  storageBucket: "dooka-staff.firebasestorage.app",
  messagingSenderId: "143844824656",
  appId: "1:143844824656:web:31d9edfeccddb1d8d32355"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ADD meeting
window.addMeeting = async () => {
  const title = document.getElementById('title').value;
  const date = document.getElementById('date').value;
  const time = document.getElementById('time').value;
  const type = document.getElementById('type').value;
  if(!title || !date) return alert('Fill title & date');
  await addDoc(collection(db, "updates"), {
    title, date, time, type,
    desc: document.getElementById('desc').value,
    created: Date.now()
  });
  alert('Added to cloud - Teachers will see!');
  document.getElementById('title').value='';
};

// DELETE from cloud - THIS FIXES YOUR PROBLEM
window.deleteMeeting = async (id) => {
  if(!confirm('Delete this meeting? Teachers will NOT see it anymore.')) return;
  try {
    await deleteDoc(doc(db, "updates", id));
    alert('Deleted from cloud!');
  } catch(e) {
    alert('Error: ' + e.message);
  }
};

// SHOW meetings from cloud
const q = query(collection(db, "updates"), orderBy("date","asc"));
onSnapshot(q, (snap)=>{
  let html='';
  snap.forEach(d=>{
    let m=d.data();
    html+=`<div class="card">
    <b>${m.date} ${m.time||''}</b> - ${m.title} [${m.type}]
    <button onclick="deleteMeeting('${d.id}')" style="float:right;background:#d00;color:white;border:none;padding:6px 12px;border-radius:6px">DELETE</button>
    <p>${m.desc||''}</p></div>`;
  });
  document.getElementById('list').innerHTML=html;
});
</script>
