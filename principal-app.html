<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooka Principal</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqV9Py9CW9tFMjcYGvucYELmDm3PFUcVQ",
  authDomain: "dooka-staff.firebaseapp.com",
  projectId: "dooka-staff",
  storageBucket: "dooka-staff.firebasestorage.app",
  messagingSenderId: "143844824656",
  appId: "1:143844824656:web:31d9edfeccddb1d8d32355"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login=()=>{
 if(document.getElementById('pin').value==='Dooka2026'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('postBox').style.display='block';
 }else alert('Wrong PIN');
}
window.postCloud=async()=>{
 let data={
  type:document.getElementById('type').value,
  title:document.getElementById('title').value,
  date:document.getElementById('date').value,
  time:document.getElementById('time').value,
  desc:document.getElementById('desc').value,
  posted:new Date().toLocaleString(),
  created:serverTimestamp()
 };
 if(!data.title) return alert('Add title');
 await addDoc(collection(db,'updates'), data);
 alert('✅ Posted to Cloud! All teachers get it instantly');
 document.getElementById('title').value='';document.getElementById('desc').value='';
}
window.deletePost=async(id)=>{ if(confirm('Delete?')) await deleteDoc(doc(db,'updates',id)); }

const q=query(collection(db,'updates'), orderBy('created','desc'));
onSnapshot(q, snap=>{
 let h=''; snap.forEach(d=>{
  let v=d.data();
  h+=`<div class="card"><b>${v.type?.toUpperCase()}</b> - ${v.posted}<h3>${v.title}</h3><p>${v.date} ${v.time}</p><p>${v.desc}</p><button onclick="deletePost('${d.id}')" style="color:red;background:none;border:none">Delete</button></div>`;
 });
 document.getElementById('list').innerHTML=h;
});
</script>
<style>
body{margin:0;font-family:sans-serif;background:#fdf8f5}
.header{background:#7b2c2c;color:white;padding:20px;text-align:center}
.header img{width:75px;height:75px;border-radius:50%;background:white;padding:4px}
.card{background:white;margin:12px;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{background:#7b2c2c;color:white;border:none;padding:14px;border-radius:10px;width:100%;font-weight:bold}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<div class="header">
<img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2602/2602414.png'">
<h2>Dooka Primary</h2>
<p>Principal - Cloud Panel</p>
</div>
<div class="card" id="loginBox">
<h3>🔐 Principal Login</h3>
<input id="pin" type="password" placeholder="PIN = Dooka2026">
<button class="btn" onclick="login()">Login</button>
</div>
<div class="card" id="postBox" style="display:none">
<h3>📢 Post Meeting</h3>
<select id="type"><option>meeting</option><option>event</option><option>urgent</option></select>
<input id="title" placeholder="Title">
<input id="date" type="date"><input id="time" type="time">
<textarea id="desc" placeholder="Details"></textarea>
<button class="btn" onclick="postCloud()">Post & Push to All Teachers</button>
</div>
<div id="list"></div>
</body>
</html>
