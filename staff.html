<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooka Staff</title>
<style>body{font-family:sans-serif;background:#f5f5f5;padding:10px}.card{background:white;padding:15px;border-radius:10px;margin:10px 0;box-shadow:0 2px 5px #ccc}input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:6px}.btn{background:#7b2c2c;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold}</style>
</head>
<body>
<h2 style="background:#7b2c2c;color:white;padding:15px;text-align:center;border-radius:10px">Dooka Staff Updates</h2>

<div class="card" id="loginBox">
<h3>Principal Login</h3>
<input id="pin" type="password" placeholder="PIN = Dooka2026">
<button class="btn" onclick="login()">Login</button>
<button class="btn" style="background:black;margin-top:8px" onclick="Notification.requestPermission().then(()=>alert('Notifications ON'))">🔔 Enable Notifications (Teachers click here)</button>
</div>

<div class="card" id="principalBox" style="display:none">
<h3>Post Meeting / Event</h3>
<select id="type"><option>meeting</option><option>event</option><option>urgent</option></select>
<input id="title" placeholder="Title">
<input id="date" type="date">
<input id="time" type="time">
<textarea id="desc" placeholder="Details"></textarea>
<button class="btn" onclick="post()">Post & Notify</button>
</div>

<div id="list"></div>

<script>
let data=JSON.parse(localStorage.getItem('dooka')||'[]');
function login(){if(document.getElementById('pin').value=='Dooka2026'){document.getElementById('principalBox').style.display='block';alert('Principal OK')}else alert('Wrong PIN')}
function post(){let o={title:title.value,date:date.value,time:time.value,desc:desc.value,type:type.value,when:new Date().toLocaleString()};data.unshift(o);localStorage.setItem('dooka',JSON.stringify(data));render();if(Notification.permission=='granted')new Notification(o.title,{body:o.date+' '+o.time});alert('Posted!')}
function render(){let h='';data.forEach(d=>{h+=`<div class="card"><b>${d.type.toUpperCase()}</b> - ${d.when}<h3>${d.title}</h3><p>${d.date} ${d.time}</p><p>${d.desc}</p></div>`});document.getElementById('list').innerHTML=h}
render();
</script>
</body>
</html>
