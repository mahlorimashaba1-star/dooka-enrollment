<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooka Primary - School Letters</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{background:#fdf0f0;margin:0}
.header{background:#800000;color:white;padding:20px;text-align:center}
.box{background:white;margin:12px;padding:18px;border-radius:14px;border:3px solid #800000}
.letter-card{background:white;border-left:6px solid #800000;padding:14px;margin:12px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.footer{text-align:center;padding:15px;font-size:11px;color:#666;font-weight:bold}
</style></head><body>
<div class="header"><h2>DOOKA PRIMARY SCHOOL</h2><p style="color:#ffd700;font-weight:900">THUTO BOTSHELO</p><p style="font-size:12px">OFFICIAL SCHOOL LETTERS FOR PARENTS</p></div>
<div class="box">
<h2 style="color:#800000;margin:0">✉️ Latest Letters</h2>
<p style="font-size:13px;color:#666;font-weight:bold">All official updates from school. Pull down to refresh.</p>
<div id="lettersList">⏳ Loading letters...</div>
</div>
<div class="footer">© 2027 Dooka Primary - Bosplaas</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCVm-xNEv4IwZ5pk79YFOLOMapnAOlUCrM",authDomain:"dooka-enrollment.firebaseapp.com",projectId:"dooka-enrollment",storageBucket:"dooka-enrollment.firebasestorage.app",messagingSenderId:"75187233656",appId:"1:75187233656:web:962e5eba5b15892c295e8d"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
async function loadLetters(){
 let list=document.getElementById('lettersList');
 try{
  let snap=await db.collection('letters').orderBy('Timestamp','desc').get();
  if(snap.empty){list.innerHTML='<p>No letters yet. School will publish soon.</p>';return;}
  let html='';
  snap.forEach(doc=>{
   let d=doc.data();
   html+=`<div class="letter-card"><div style="font-size:11px;color:#888">📅 ${d.Date} | ${d.GradeTarget}</div><div style="font-weight:900;color:#800000;margin:5px 0;font-size:16px">${d.Title}</div><div style="line-height:1.6;white-space:pre-wrap">${d.Body}</div></div>`;
  });
  list.innerHTML=html;
 }catch(e){list.innerHTML='❌ Error: '+e.message;}
}
loadLetters();
setInterval(loadLetters, 30000);
</script></body></html>
