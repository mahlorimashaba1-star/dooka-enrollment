<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooka Primary - Enrollment 2026</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{background:#fdf0f0;margin:0}
.header{background:#800000;color:white;padding:20px;text-align:center}
.logo{width:110px;height:110px;border-radius:50%;border:4px solid #ffd700;background:white;object-fit:contain}
.box{background:white;margin:12px;padding:18px;border-radius:14px;border:3px solid #800000}
.section-title{background:#800000;color:#ffd700;padding:8px 12px;border-radius:8px;margin:18px 0 8px;font-weight:900}
.input,select,textarea{width:100%;padding:13px;border:2px solid #800000;border-radius:10px;margin:7px 0;font-weight:bold}
.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:600px){.row{flex-direction:column}}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:18px;cursor:pointer;background:#800000;color:#ffd700}
.upload-box{border:2px dashed #800000;padding:12px;border-radius:10px;margin:10px 0;background:#fff8e1}
.file-status{font-size:12px;font-weight:bold;color:green}
.preview{max-width:100%;max-height:120px;border-radius:8px;margin-top:5px;display:none}
.footer{text-align:center;padding:15px;font-size:11px;color:#666;font-weight:bold}
</style>
</head>

</div>

<textarea id="address" class="input" placeholder="Home Address *"></textarea>
